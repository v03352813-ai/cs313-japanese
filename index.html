        <h3 style="font-size: 16px; font-weight: bold; color: #0369a1; margin-top: 16px;">1. JLPT 历届全真官方模考大考场（N1 / N2 / N3 / N4 / N5 全等级覆盖）</h3>
        <p>1:1 还原真实考场机考界面。涵盖言语知识（文字·词汇·语法）、读解分析与原声听解三大核心部分。内置全真时长倒计时与标准答题卡，支持交卷后自动核算总分与各单项得分、全卷错题智能归因深度解析，以及重点生词一键归档至个人专属错题本。</p>

        <h3 style="font-size: 16px; font-weight: bold; color: #0369a1; margin-top: 16px;">2. 五十音图与 NHK 阶梯声调可视化诊所</h3>
        <p>清音、浊音、半浊音与拗音标准真人发音音轨。独创阶梯声调走向标注系统，精准攻克 0型（平板型）、1型（头高型）、2型（中高型）与 3型（尾高型）发音盲区，告别“中式塑料日语发音”。</p>

        <h3 style="font-size: 16px; font-weight: bold; color: #0369a1; margin-top: 16px;">3. 6,500+ 官方考纲核心词汇闪卡与艾宾浩斯记忆（SRS）</h3>
        <p>覆盖 N5 至 N1 全级别大纲词库。配备假名注音、汉字写法、标准词性（自他动词成对标记）、精选双语例句与纯正东京音朗读，支持艾宾浩斯遗忘曲线智能复习算法。</p>

        <h3 style="font-size: 16px; font-weight: bold; color: #0369a1; margin-top: 16px;">4. 核心语法树与视觉化思维导图</h3>
        <p>系统梳理助词辨析（は vs が、に vs で）、使役被动态、授受动词关系链以及敬语体系（尊敬语·谦让语·郑重语），配套历年高频真题典型例句精析。</p>

        <h3 style="font-size: 16px; font-weight: bold; color: #0369a1; margin-top: 16px;">5. 原声台词精听与文化视听库</h3>
        <p>收录精选经典动漫与影视双语名台词原声切片，支持单句慢速循环精听、语法拆解与影子跟读训练。</p>
